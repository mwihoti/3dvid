<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3dvid camera effects</title>
<style>
:root{
  color-scheme: dark;   /* unchecked checkboxes and other native controls too */
  --bg:#05070f; --panel:#0b1020; --line:#1d2748; --ink:#e7ecff; --dim:#8f9bc4;
  --cyan:#39c6ff; --pink:#ff2d95; --orange:#ff6a00; --teal:#19d4c8;
}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{width:320px;padding:12px 14px 14px;box-sizing:border-box;
  background:linear-gradient(180deg,var(--panel),#080d1a)}
.top{display:flex;align-items:center;gap:9px}
.top img{width:26px;height:26px}
.top h1{margin:0;font-size:15px;font-weight:650;flex:1}
.top h1 span{background:linear-gradient(90deg,var(--orange),var(--pink) 55%,#8a2bff);
  -webkit-background-clip:text;background-clip:text;color:transparent}
/* the on/off switch */
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:99px;background:#070c18;border:1px solid var(--line);transition:.15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;
  background:var(--dim);transition:.15s}
.switch input:checked + i{border-color:var(--cyan);box-shadow:0 0 14px -5px var(--cyan)}
.switch input:checked + i::after{left:21px;background:var(--cyan)}
.switch input:focus-visible + i{outline:2px solid var(--cyan);outline-offset:2px}
h2{margin:12px 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--dim);font-weight:600}
.seg{display:grid;gap:5px}
.seg button{min-width:0;background:#070c18;color:var(--dim);border:1px solid var(--line);border-radius:8px;
  padding:6px 2px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,#182248,#0e1530);color:var(--ink);
  border-color:var(--cyan);box-shadow:0 0 0 1px rgba(57,198,255,.25),0 0 14px -6px var(--cyan)}
#effect{grid-template-columns:repeat(4,minmax(0,1fr))}
#bg{grid-template-columns:repeat(5,auto)}   /* sized by label: "Filmed FX" needs more than a fifth */
#bg button{padding:6px 5px}
#face,#quality{grid-template-columns:repeat(3,minmax(0,1fr))}
.checks{display:flex;gap:14px;margin-top:10px}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
.chk input{width:15px;height:15px;accent-color:var(--cyan);margin:0}
body.off .controls{opacity:.45}
.note{margin:12px 0 0;color:var(--dim);font-size:11.5px}
.note b{color:var(--ink);font-family:ui-monospace,monospace;background:#141c38;border-radius:4px;padding:0 4px;font-weight:500}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="top">
  <img src="icons/icon-48.png" alt="">
  <h1><span>3dvid</span> camera</h1>
  <label class="switch" title="Style the camera on websites"><input type="checkbox" id="enabled" aria-label="Effects on"><i></i></label>
</div>
<div class="controls">
  <h2>Effect</h2>
  <div class="seg" id="effect"></div>
  <h2>Background</h2>
  <div class="seg" id="bg"></div>
  <h2>Face</h2>
  <div class="seg" id="face"></div>
  <h2>Camera resolution</h2>
  <div class="seg" id="quality"></div>
  <div class="checks">
    <label class="chk" title="Meeting apps already mirror your self-view; this flips what others see"><input type="checkbox" id="mirror">Mirror</label>
    <label class="chk"><input type="checkbox" id="grain">Grain</label>
    <label class="chk" title="Chromatic aberration"><input type="checkbox" id="chroma">Chroma</label>
  </div>
</div>
<p class="note" id="note">Changes apply live in the call. <b>Alt+Shift+E</b> picks the next effect.
  Switched on after the call opened the camera? Re-select the camera there.</p>
<p class="note"><a href="https://mwihoti.github.io/3dvid/" target="_blank" rel="noopener">Open the full 3dvid camera page</a></p>
<script type="module" src="popup.js"></script>
</body>
</html>
