# Publishes the live camera page (web/camera/) to GitHub Pages: free, HTTPS (which
# phones require before they will open a camera), and no server to pay for. The
# page detects that the studio API is absent and hides the studio-only options.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions"
#   (or: gh api -X POST repos/<owner>/3dvid/pages -f build_type=workflow)
# Then it is served at https://<owner>.github.io/3dvid/
name: camera page

on:
  push:
    branches: [main]
    paths: ['web/camera/**', '.github/workflows/camera-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/camera
      - id: deploy
        uses: actions/deploy-pages@v5
