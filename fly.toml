# Fly.io deployment. First time:
#   fly launch --no-deploy --copy-config --name 3dvid      # creates the app, keeps this file
#   fly volumes create data --size 20 --region <region>
#   fly secrets set AUTH_TOKEN=$(openssl rand -hex 24)
#   fly deploy
# Then open https://3dvid.fly.dev and paste the token.
# Stop billing when idle:  fly machine stop     Start again:  fly machine start
app = "3dvid"
primary_region = "fra"    # pick the region closest to you (fra, lhr, jnb, iad, ...)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  # keep the machine running while a render is in progress; stop it by hand when done
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "performance-8x"   # 8 dedicated vCPU / 16 GB; performance-16x doubles both

[mounts]
  source = "data"
  destination = "/app/data"

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
