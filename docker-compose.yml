# CPU:  docker compose up -d --build
# GPU:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  studio:
    build:
      context: .
      args:
        TORCH_INDEX: cpu
    image: 3dvid:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      AUTH_TOKEN: ${AUTH_TOKEN:?set AUTH_TOKEN in .env or the environment}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
